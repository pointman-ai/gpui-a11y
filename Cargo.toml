[package]
name = "gpui-a11y"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "An accessibility tree for GPUI windows, on accesskit: macOS (VoiceOver) and Linux (AT-SPI)."

# its own workspace
[workspace]

[dependencies]
gpui = "0.2.2"
accesskit = "0.25"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27"
objc2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.24"

# gpui -> xattr 0.2.3 does not build on Linux with current libc (ENOATTR); only used when this crate is built on its own
[patch.crates-io]
xattr = { path = "patches/xattr" }
